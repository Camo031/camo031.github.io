---
layout: null
---

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Camden Lethcoe</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Matter.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

<style>
body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

h1 {
  margin: 20px;
  font-family: Georgia, serif;
  font-size: 48px;
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  align-items: baseline;
  position: relative;
  z-index: 10;
}

h1 a, #return-btn {
  font-size: 13px;
  color: #999;
  text-decoration: none;
  cursor: pointer;
  font-weight: 300;
}

h1 a:hover, #return-btn:hover {
  color: #fff;
}

.separator { font-size: 10px; color: #666; }

.gallery {
  column-count: 4;
  column-gap: 0;
  max-width: 1200px;
  margin: 0 auto;
}

.gallery a {
  display: block;
  break-inside: avoid;
}

.gallery img {
  width: 100%;
  display: block;
  pointer-events: none;
  user-select: none;
}

.hidden { display: none !important; }

#physics-gallery {
  position: fixed;
  top: 120px;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 100;
  display: none;
}

#physics-gallery canvas {
  cursor: grab;
}

#physics-gallery canvas:active {
  cursor: grabbing;
}

footer {
  text-align: center;
  padding: 20px;
  color: #bbb;
}

#fun-btn {
  cursor: pointer;
  font-size: 12px;
}
</style>
</head>

<body>

<h1>
  <span>Camden Lethcoe</span>
  <span class="separator">|</span>
  <a href="https://instagram.com/ensembleofthings" target="_blank">instagram</a>
  <span class="separator">|</span>
  <a href="mailto:cam@lethcoe.pics">email</a>
  <span class="separator hidden" id="return-sep">|</span>
  <span id="return-btn" class="hidden">return to normalcy</span>
</h1>

<!-- Static gallery -->
<div class="gallery" id="static-gallery">
{% assign photos = site.static_files | where_exp:"f","f.path contains '/photos/'" %}
{% for photo in photos %}
  <a href="{{ photo.path }}">
    <img src="{{ photo.path | replace:'/photos/','/thumbnails/' }}">
  </a>
{% endfor %}
</div>

<!-- Physics gallery -->
<div id="physics-gallery"></div>

<footer>
  <div id="fun-btn">click for fun</div>
  © <span id="y"></span> Camden Lethcoe
</footer>

<script>
document.getElementById("y").textContent = new Date().getFullYear();
</script>

<script>
/* ================= MATTER SETUP ================= */

const {
  Engine, Render, World, Bodies, Body,
  Mouse, MouseConstraint, Composite, Events
} = Matter;

let engine, render;

const funBtn = document.getElementById("fun-btn");
const returnBtn = document.getElementById("return-btn");
const returnSep = document.getElementById("return-sep");
const staticGallery = document.getElementById("static-gallery");
const physicsGallery = document.getElementById("physics-gallery");

funBtn.onclick = () => {
  staticGallery.classList.add("hidden");
  funBtn.classList.add("hidden");
  physicsGallery.style.display = "block";
  returnBtn.classList.remove("hidden");
  returnSep.classList.remove("hidden");
  document.body.style.overflow = "hidden";
  initPhysics();
};

returnBtn.onclick = teardownPhysics;

function teardownPhysics() {
  Render.stop(render);
  World.clear(engine.world);
  Engine.clear(engine);
  render.canvas.remove();
  physicsGallery.style.display = "none";
  staticGallery.classList.remove("hidden");
  funBtn.classList.remove("hidden");
  returnBtn.classList.add("hidden");
  returnSep.classList.add("hidden");
  document.body.style.overflow = "";
}

function initPhysics() {
  engine = Engine.create();
  engine.gravity.x = 0;
  engine.gravity.y = 0;

  render = Render.create({
    element: physicsGallery,
    engine,
    options: {
      width: window.innerWidth,
      height: window.innerHeight - 120,
      background: "#111",
      wireframes: false,
      pixelRatio: window.devicePixelRatio
    }
  });

  Render.run(render);
  Engine.run(engine);

  /* 🚫 CRITICAL: disable native canvas dragging + export */
  render.canvas.draggable = false;
  render.canvas.addEventListener("dragstart", e => e.preventDefault());
  render.canvas.addEventListener("contextmenu", e => e.preventDefault());

  const w = render.options.width;
  const h = render.options.height;

  World.add(engine.world, [
    Bodies.rectangle(w/2, -50, w, 100, { isStatic: true }),
    Bodies.rectangle(w/2, h+50, w, 100, { isStatic: true }),
    Bodies.rectangle(-50, h/2, 100, h, { isStatic: true }),
    Bodies.rectangle(w+50, h/2, 100, h, { isStatic: true })
  ]);

  /* ✅ CORRECT MOUSE */
  const mouse = Mouse.create(render.canvas);

  Mouse.setScale(mouse, {
    x: 1 / window.devicePixelRatio,
    y: 1 / window.devicePixelRatio
  });

  const mouseConstraint = MouseConstraint.create(engine, {
    mouse,
    constraint: {
      stiffness: 0.85,
      damping: 0.15,
      render: { visible: false }
    }
  });

  World.add(engine.world, mouseConstraint);
  render.mouse = mouse;

  /* Photos */
  const photos = [
  {% for photo in photos %}
    "{{ photo.path | replace:'/photos/','/thumbnails/' }}",
  {% endfor %}
  ];

  photos.forEach(src => {
    const size = 90 + Math.random() * 40;

    const body = Bodies.circle(
      w / 2 + Math.random() * 300 - 150,
      h / 2 + Math.random() * 300 - 150,
      size / 2,
      {
        restitution: 0.95,
        frictionAir: 0.06,
        density: 0.001,
        render: {
          sprite: {
            texture: src,
            xScale: size / 400,
            yScale: size / 400
          }
        }
      }
    );

    body.photo = true;
    World.add(engine.world, body);
  });

  /* Gentle drift */
  Events.on(engine, "beforeUpdate", () => {
    Composite.allBodies(engine.world)
      .filter(b => b.photo)
      .forEach(b => {
        Body.applyForce(b, b.position, {
          x: (Math.random() - 0.5) * 0.00002,
          y: (Math.random() - 0.5) * 0.00002
        });
      });
  });
}
</script>

</body>
</html>
