---
layout: null
---

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Camden Lethcoe</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Lightbox2 -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/css/lightbox.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/js/lightbox-plus-jquery.min.js"></script>

<!-- Matter.js (only used in fun mode) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: #fff;
}

h1 {
  margin: 20px;
  font-weight: 300;
  font-family: Georgia, serif;
  font-size: 48px;
  display: flex;
  align-items: center;
  gap: 20px;
}

h1 a,
#return-btn {
  font-size: 14px;
  font-family: Arial, sans-serif;
  color: #bbb;
  text-decoration: none;
  cursor: pointer;
}

h1 a:hover,
#return-btn:hover {
  color: #fff;
}

.separator {
  font-size: 14px;
  color: #666;
}

/* ORIGINAL GRID */
.gallery {
  column-count: 4;
  column-gap: 0;
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
}

@media (max-width: 768px) {
  .gallery {
    column-count: 2;
  }
}

.gallery a {
  display: inline-block;
  width: 100%;
  break-inside: avoid;
}

.gallery img {
  width: 100%;
  display: block;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}

.gallery a {
  position: relative;
}

.gallery a::after {
  content: 'Camden Lethcoe';
  position: absolute;
  bottom: 10px;
  right: 10px;
  color: rgba(255, 255, 255, 0.5);
  font-size: 10px;
  pointer-events: none;
  text-shadow: 0 0 3px rgba(0, 0, 0, 0.8);
}

/* Physics container */
#physics-gallery {
  position: fixed;
  inset: 120px 0 140px 0;
  display: none;
  z-index: 1;
}

/* Footer + buttons */
footer {
  color: #bbb;
  padding: 30px 20px 10px;
  text-align: center;
}

#fun-btn {
  font-size: 12px;
  color: #bbb;
  cursor: pointer;
  margin-bottom: 30px;
}

#fun-btn:hover {
  color: #fff;
}

#contact-container {
  text-align: center;
  font-family: "Times New Roman", serif;
  font-size: 8pt;
  margin-bottom: 40px;
  cursor: pointer;
}

#email {
  opacity: 0;
  transition: opacity 0.5s ease;
}

.hidden {
  display: none !important;
}
</style>
</head>

<body>

<h1>
  <span>Camden Lethcoe</span>
  <span class="separator">|</span>
  <a href="https://instagram.com/ensembleofthings" target="_blank">Instagram</a>
  <span class="separator">|</span>
  <a href="mailto:cam@lethcoe.pics">Email</a>
  <span class="separator hidden" id="return-sep">|</span>
  <span id="return-btn" class="hidden">return to normalcy</span>
</h1>

<!-- STATIC GRID (DEFAULT MODE) -->
<div class="gallery" id="static-gallery">
  {% assign photos = site.static_files | where_exp:"f","f.path contains '/photos/'" %}
  {% for photo in photos %}
    <a href="{{ photo.path }}" data-lightbox="portfolio" data-title="{{ photo.name }}">
      <img src="{{ photo.path | replace:'/photos/','/thumbnails/' }}" alt="{{ photo.name }}">
    </a>
  {% endfor %}
</div>

<!-- PHYSICS MODE -->
<div id="physics-gallery"></div>

<footer>
  <div id="fun-btn">click for fun</div>
  © <span id="y"></span> Camden Lethcoe
</footer>

<div id="contact-container">
  <span id="contact-button">contact me</span>
  <span id="email"> cam@lethcoe.pics</span>
</div>

<script>
document.getElementById("y").textContent = new Date().getFullYear();

document.getElementById("contact-button").onclick = () => {
  document.getElementById("email").style.opacity = 1;
  document.getElementById("contact-button").style.display = "none";
};

// Disable right-click on images
document.addEventListener('contextmenu', (e) => {
  if (e.target.tagName === 'IMG') {
    e.preventDefault();
    return false;
  }
});

// Disable common save shortcuts
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
    e.preventDefault();
    return false;
  }
});

// Disable drag on images
document.addEventListener('dragstart', (e) => {
  if (e.target.tagName === 'IMG') {
    e.preventDefault();
    return false;
  }
});
</script>

<script>
/* ========= FUN MODE ========= */

let engine, render, mouseConstraint;
const funBtn = document.getElementById("fun-btn");
const returnBtn = document.getElementById("return-btn");
const returnSep = document.getElementById("return-sep");
const staticGallery = document.getElementById("static-gallery");
const physicsGallery = document.getElementById("physics-gallery");

const isMobile = window.matchMedia("(max-width: 768px)").matches;

funBtn.onclick = () => {
  staticGallery.classList.add("hidden");
  funBtn.classList.add("hidden");
  physicsGallery.style.display = "block";
  returnBtn.classList.remove("hidden");
  returnSep.classList.remove("hidden");
  document.body.style.overflow = "hidden";
  initPhysics();
};

returnBtn.onclick = () => {
  Matter.Render.stop(render);
  Matter.World.clear(engine.world);
  Matter.Engine.clear(engine);
  render.canvas.remove();
  physicsGallery.style.display = "none";
  staticGallery.classList.remove("hidden");
  funBtn.classList.remove("hidden");
  returnBtn.classList.add("hidden");
  returnSep.classList.add("hidden");
  document.body.style.overflow = "";
};

/* Init physics only when needed */
function initPhysics() {
  const {
    Engine, Render, World, Bodies, Mouse, MouseConstraint, Composite, Events
  } = Matter;

  engine = Engine.create();
  engine.gravity.y = 0;

  render = Render.create({
    element: physicsGallery,
    engine,
    options: {
      width: window.innerWidth,
      height: isMobile ? window.innerHeight - 180 : window.innerHeight - 260,
      background: "#111",
      wireframes: false,
      pixelRatio: window.devicePixelRatio
    }
  });

  Render.run(render);
  Engine.run(engine);

  // Walls
  const w = render.options.width;
  const h = render.options.height;
  World.add(engine.world, [
    Bodies.rectangle(w/2, -30, w, 60, { isStatic:true }),
    Bodies.rectangle(w/2, h+30, w, 60, { isStatic:true }),
    Bodies.rectangle(-30, h/2, 60, h, { isStatic:true }),
    Bodies.rectangle(w+30, h/2, 60, h, { isStatic:true })
  ]);

  // Drag
  const mouse = Mouse.create(render.canvas);
  mouseConstraint = MouseConstraint.create(engine, {
    mouse,
    constraint: {
      stiffness: isMobile ? 0.28 : 0.15,
      damping: isMobile ? 0.25 : 0.05,
      render: { visible:false }
    }
  });
  World.add(engine.world, mouseConstraint);

  // Photos
  const photos = [
  {% assign photos = site.static_files | where_exp:"f","f.path contains '/photos/'" %}
  {% for photo in photos %}
    {
      full: "{{ photo.path }}",
      thumb: "{{ photo.path | replace:'/photos/','/thumbnails/' }}",
      title: "{{ photo.name }}"
    },
  {% endfor %}
  ];

  photos.forEach(p => {
    const size = isMobile ? 130 + Math.random()*40 : 90 + Math.random()*50;
    const body = Bodies.circle(
      Math.random()*w,
      Math.random()*h,
      size/2,
      {
        restitution: isMobile ? 0.6 : 0.9,
        frictionAir: isMobile ? 0.08 : 0.03,
        render: {
          sprite: {
            texture: p.thumb,
            xScale: size/400,
            yScale: size/400
          }
        }
      }
    );
    body.photo = p;
    
    // On mobile, only add every 3rd photo to reduce clutter
    if (!isMobile || Math.random() > 0.66) {
      World.add(engine.world, body);
    }
  });

  // Give a few random images initial velocity on desktop for visual cue
  if (!isMobile) {
    const allBodies = Composite.allBodies(engine.world).filter(b => b.photo);
    const numToAnimate = Math.min(3, allBodies.length);
    for (let i = 0; i < numToAnimate; i++) {
      const randomBody = allBodies[Math.floor(Math.random() * allBodies.length)];
      Matter.Body.setVelocity(randomBody, {
        x: (Math.random() - 0.5) * 20,
        y: (Math.random() - 0.5) * 20
      });
    }
  }

  // Click → lightbox (no drag)
  let dragged = false;
  Events.on(mouseConstraint, "startdrag", () => dragged = true);
  Events.on(mouseConstraint, "enddrag", () => setTimeout(()=>dragged=false,60));

  render.canvas.addEventListener("mouseup", () => {
    if (dragged) return;
    Composite.allBodies(engine.world).forEach(b => {
      if (b.photo && Matter.Bounds.contains(b.bounds, mouse.position)) {
        const a = document.createElement("a");
        a.href = b.photo.full;
        a.setAttribute("data-lightbox", "portfolio");
        a.setAttribute("data-title", b.photo.title);
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }
    });
  });
}
</script>

</body>
</html>
