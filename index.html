---
layout: null
---

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Camden Lethcoe</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Lightbox -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/css/lightbox.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/js/lightbox-plus-jquery.min.js"></script>

<!-- Matter.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

<style>
body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
}

h1 {
  margin: 20px;
  font-family: Georgia, serif;
  font-size: 48px;
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
}

h1 a, #return-btn {
  font-size: 14px;
  color: #bbb;
  text-decoration: none;
  cursor: pointer;
}

.separator { color: #666; }

/* Masonry grid (no gaps) */
.gallery {
  column-count: 4;
  column-gap: 0;
  max-width: 1200px;
  margin: 0 auto;
}

.gallery a {
  display: block;
  width: 100%;
  break-inside: avoid;
}

.gallery img {
  width: 100%;
  display: block;
}

@media (max-width: 768px) {
  h1 { font-size: 32px; }
  .gallery { column-count: 2; }
}

.hidden { display: none !important; }

/* Physics canvas */
#physics-gallery {
  position: fixed;
  top: 0;
  bottom: 0;
  left: 0;
  right: 0;
  display: none;
  z-index: 1;
}

footer {
  text-align: center;
  color: #bbb;
  padding: 20px;
}

#fun-btn {
  font-size: 12px;
  cursor: pointer;
}

#contact-container {
  font-family: "Times New Roman", serif;
  font-size: 8pt;
  text-align: center;
  margin-bottom: 30px;
}

/* Mobile fun mode header */
.mobile-fun-header {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  background: #111;
  padding: 20px;
  z-index: 10;
  text-align: center;
}

.mobile-fun-header span {
  font-size: 14px;
  color: #bbb;
  cursor: pointer;
  font-family: Arial, sans-serif;
}

@media (max-width: 768px) {
  h1.fun-mode {
    display: none;
  }
  
  .mobile-fun-header.active {
    display: block;
  }
  
  #physics-gallery.mobile-active {
    top: 60px;
  }
}
</style>
</head>

<body>

<div class="mobile-fun-header" id="mobile-header">
  <span id="mobile-return-btn">return to normalcy</span>
</div>

<h1 id="main-header">
  <span>Camden Lethcoe</span>
  <span class="separator">|</span>
  <a href="https://instagram.com/ensembleofthings" target="_blank">Instagram</a>
  <span class="separator">|</span>
  <a href="mailto:cam@lethcoe.pics">Email</a>
  <span class="separator hidden" id="return-sep">|</span>
  <span id="return-btn" class="hidden">return to normalcy</span>
</h1>

<!-- Static grid -->
<div class="gallery" id="static-gallery">
{% assign photos = site.static_files | where_exp:"f","f.path contains '/photos/'" %}
{% for photo in photos %}
  <a href="{{ photo.path }}" data-lightbox="portfolio">
    <img src="{{ photo.path | replace:'/photos/','/thumbnails/' }}">
  </a>
{% endfor %}
</div>

<!-- Fun mode -->
<div id="physics-gallery"></div>

<footer>
  <div id="fun-btn">click for fun</div>
  © <span id="y"></span> Camden Lethcoe
</footer>

<div id="contact-container">
  <span id="contact-button">contact me</span>
  <span id="email" style="opacity:0;"> cam@lethcoe.pics</span>
</div>

<script>
document.getElementById("y").textContent = new Date().getFullYear();
document.getElementById("contact-button").onclick = () => {
  document.getElementById("email").style.opacity = 1;
};
</script>

<script>
/* ================= FUN MODE ================= */

const {
  Engine, Render, World, Bodies, Body,
  Mouse, MouseConstraint, Composite, Events
} = Matter;

const isMobile = window.matchMedia("(max-width:768px)").matches;
let engine, render, mouseConstraint;

const funBtn = document.getElementById("fun-btn");
const returnBtn = document.getElementById("return-btn");
const mobileReturnBtn = document.getElementById("mobile-return-btn");
const returnSep = document.getElementById("return-sep");
const staticGallery = document.getElementById("static-gallery");
const physicsGallery = document.getElementById("physics-gallery");
const mainHeader = document.getElementById("main-header");
const mobileHeader = document.getElementById("mobile-header");

funBtn.onclick = () => {
  staticGallery.classList.add("hidden");
  funBtn.classList.add("hidden");
  physicsGallery.style.display = "block";
  document.body.style.overflow = "hidden";
  
  if (isMobile) {
    mainHeader.classList.add("fun-mode");
    mobileHeader.classList.add("active");
    physicsGallery.classList.add("mobile-active");
  } else {
    returnBtn.classList.remove("hidden");
    returnSep.classList.remove("hidden");
  }
  
  initPhysics();
};

returnBtn.onclick = teardownPhysics;
mobileReturnBtn.onclick = teardownPhysics;

function teardownPhysics() {
  Render.stop(render);
  World.clear(engine.world);
  Engine.clear(engine);
  render.canvas.remove();
  physicsGallery.style.display = "none";
  physicsGallery.classList.remove("mobile-active");
  staticGallery.classList.remove("hidden");
  funBtn.classList.remove("hidden");
  returnBtn.classList.add("hidden");
  returnSep.classList.add("hidden");
  mainHeader.classList.remove("fun-mode");
  mobileHeader.classList.remove("active");
  document.body.style.overflow = "";
}

function initPhysics() {
  engine = Engine.create();
  engine.gravity.x = 0;
  engine.gravity.y = 0;

  const headerHeight = isMobile ? 60 : document.querySelector("h1").offsetHeight;

  render = Render.create({
    element: physicsGallery,
    engine,
    options: {
      width: window.innerWidth,
      height: window.innerHeight - headerHeight,
      background: "#111",
      wireframes: false,
      pixelRatio: window.devicePixelRatio
    }
  });

  Render.run(render);
  Engine.run(engine);

  const w = render.options.width;
  const h = render.options.height;

  // Walls
  World.add(engine.world, [
    Bodies.rectangle(w/2, -40, w, 80, { isStatic:true }),
    Bodies.rectangle(w/2, h+40, w, 80, { isStatic:true }),
    Bodies.rectangle(-40, h/2, 80, h, { isStatic:true }),
    Bodies.rectangle(w+40, h/2, 80, h, { isStatic:true })
  ]);

  // Drag
  const mouse = Mouse.create(render.canvas);
  mouseConstraint = MouseConstraint.create(engine, {
    mouse,
    constraint: {
      stiffness: 0.12,
      damping: isMobile ? 0.5 : 0.05,
      render: { visible:false }
    }
  });
  World.add(engine.world, mouseConstraint);

  // Photos
  const photos = [
  {% for photo in photos %}
    {
      thumb: "{{ photo.path | replace:'/photos/','/thumbnails/' }}"
    },
  {% endfor %}
  ];

  photos.forEach(p => {
    const current = Composite.allBodies(engine.world).filter(b => b.photo).length;
    if (isMobile && current >= 10) return;

    const size = isMobile ? 50 + Math.random()*20 : 90 + Math.random()*40;

    const body = Bodies.circle(
      w*0.25 + Math.random()*w*0.5,
      h*0.25 + Math.random()*h*0.5,
      size/2,
      {
        restitution: 0.9,
        frictionAir: 0.08,
        render: {
          sprite: {
            texture: p.thumb,
            xScale: size/400,
            yScale: size/400
          }
        }
      }
    );
    body.photo = true;
    World.add(engine.world, body);
  });

  /* Gentle drift + mutual gravitational attraction */
  Events.on(engine, "beforeUpdate", () => {
    const bodies = Composite.allBodies(engine.world).filter(b => b.photo);
    
    bodies.forEach(a => {
      // Mutual gravitational attraction between photos
      bodies.forEach(b => {
        if (a === b) return;
        
        const dx = b.position.x - a.position.x;
        const dy = b.position.y - a.position.y;
        const dist = Math.hypot(dx, dy);
        
        if (dist > 0) {
          // Gravitational force (attractive)
          const strength = 0.000008;
          const force = strength / (dist * dist);
          
          Body.applyForce(a, a.position, {
            x: (dx / dist) * force,
            y: (dy / dist) * force
          });
          
          // Slight repulsion when very close to prevent clumping
          if (dist < 100) {
            Body.applyForce(a, a.position, {
              x: -dx * 0.0000008,
              y: -dy * 0.0000008
            });
          }
        }
      });

      // Gentle random drift
      Body.applyForce(a, a.position, {
        x: (Math.random() - 0.5) * 0.00003,
        y: (Math.random() - 0.5) * 0.00003
      });
    });
  });
}
</script>

</body>
</html>
