<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Camden Lethcoe</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Lightbox2 -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/css/lightbox.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/js/lightbox-plus-jquery.min.js"></script>

<!-- Matter.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

<style>
body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

h1 {
  margin: 20px;
  font-weight: 300;
  font-family: Georgia, serif;
  font-size: 48px;
  display: flex;
  align-items: center;
  gap: 20px;
  position: relative;
  z-index: 10;
}

h1 a {
  font-size: 14px;
  font-family: Arial, sans-serif;
  color: #bbb;
  text-decoration: none;
}

h1 a:hover {
  color: #fff;
}

.separator {
  font-size: 14px;
  color: #666;
}

#physics-gallery {
  position: absolute;
  top: 120px;
  left: 0;
  right: 0;
  bottom: 140px;
}

footer {
  position: absolute;
  bottom: 70px;
  width: 100%;
  text-align: center;
  color: #bbb;
  font-size: 12px;
}

#contact-container {
  position: absolute;
  bottom: 30px;
  width: 100%;
  text-align: center;
  font-family: "Times New Roman", serif;
  font-size: 8pt;
  cursor: pointer;
}

#email {
  opacity: 0;
  transition: opacity 0.5s ease;
}
</style>
</head>

<body>

<h1>
  <span>Camden Lethcoe</span>
  <span class="separator">|</span>
  <a href="https://instagram.com/ensembleofthings" target="_blank">Instagram</a>
  <span class="separator">|</span>
  <a href="mailto:cam@lethcoe.pics">Email</a>
</h1>

<div id="physics-gallery"></div>

<footer>© <span id="y"></span> Camden Lethcoe</footer>

<div id="contact-container">
  <span id="contact-button">contact me</span>
  <span id="email"> cam@lethcoe.pics</span>
</div>

<script>
document.getElementById("y").textContent = new Date().getFullYear();

const button = document.getElementById("contact-button");
const email = document.getElementById("email");

button.addEventListener("click", () => {
  email.style.opacity = 1;
  button.style.display = "none";
});
</script>

<script>
const {
  Engine,
  Render,
  World,
  Bodies,
  Mouse,
  MouseConstraint,
  Composite,
  Events
} = Matter;

const isMobile = window.matchMedia("(max-width: 768px)").matches;
const container = document.getElementById("physics-gallery");

const engine = Engine.create();
engine.gravity.y = 0;

const render = Render.create({
  element: container,
  engine: engine,
  options: {
    width: window.innerWidth,
    height: isMobile
      ? window.innerHeight - 160
      : window.innerHeight - 260,
    background: "#111",
    wireframes: false,
    pixelRatio: window.devicePixelRatio
  }
});

Render.run(render);
Engine.run(engine);

/* Walls */
function addWalls() {
  const w = render.options.width;
  const h = render.options.height;

  World.add(engine.world, [
    Bodies.rectangle(w / 2, -30, w, 60, { isStatic: true }),
    Bodies.rectangle(w / 2, h + 30, w, 60, { isStatic: true }),
    Bodies.rectangle(-30, h / 2, 60, h, { isStatic: true }),
    Bodies.rectangle(w + 30, h / 2, 60, h, { isStatic: true })
  ]);
}
addWalls();

/* Mouse / Touch */
const mouse = Mouse.create(render.canvas);
const mouseConstraint = MouseConstraint.create(engine, {
  mouse,
  constraint: {
    stiffness: isMobile ? 0.28 : 0.15,
    damping: isMobile ? 0.25 : 0.05,
    render: { visible: false }
  }
});
World.add(engine.world, mouseConstraint);

/* Photos via Jekyll */
const photos = [
{% assign photos = site.static_files | where_exp:"f","f.path contains '/photos/'" %}
{% for photo in photos %}
  {
    full: "{{ photo.path }}",
    thumb: "{{ photo.path | replace:'/photos/','/thumbnails/' }}",
    title: "{{ photo.name }}"
  },
{% endfor %}
];

/* Create bubbles */
photos.forEach(photo => {
  const size = isMobile
    ? 130 + Math.random() * 40
    : 90 + Math.random() * 50;

  const body = Bodies.circle(
    Math.random() * render.options.width,
    Math.random() * render.options.height,
    size / 2,
    {
      restitution: isMobile ? 0.6 : 0.9,
      frictionAir: isMobile ? 0.08 : 0.03,
      density: isMobile ? 0.002 : 0.001,
      render: {
        sprite: {
          texture: photo.thumb,
          xScale: size / 400,
          yScale: size / 400
        }
      }
    }
  );

  body.photo = photo;
  World.add(engine.world, body);
});

/* Prevent lightbox during drag */
let wasDragged = false;

Events.on(mouseConstraint, "startdrag", () => {
  wasDragged = true;
});

Events.on(mouseConstraint, "enddrag", () => {
  setTimeout(() => (wasDragged = false), 60);
});

/* Click → Lightbox */
render.canvas.addEventListener("mouseup", () => {
  if (wasDragged) return;

  const bodies = Composite.allBodies(engine.world);
  bodies.forEach(b => {
    if (b.photo && Matter.Bounds.contains(b.bounds, mouse.position)) {
      const a = document.createElement("a");
      a.href = b.photo.full;
      a.setAttribute("data-lightbox", "portfolio");
      a.setAttribute("data-title", b.photo.title);
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  });
});

/* Resize */
window.addEventListener("resize", () => {
  render.canvas.width = window.innerWidth;
  render.canvas.height = isMobile
    ? window.innerHeight - 160
    : window.innerHeight - 260;

  render.options.width = render.canvas.width;
  render.options.height = render.canvas.height;
});
</script>

</body>
</html>
