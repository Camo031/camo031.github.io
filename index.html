<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Camden Lethcoe</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Lightbox2 -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/css/lightbox.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/js/lightbox-plus-jquery.min.js"></script>

<!-- Matter.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: #fff;
  overflow: hidden;
}

h1 {
  margin: 20px;
  font-weight: 300;
  font-family: "Georgia", serif;
  font-size: 48px;
  display: flex;
  align-items: center;
  gap: 20px;
  z-index: 10;
  position: relative;
}

h1 a {
  font-size: 14px;
  font-family: Arial, sans-serif;
  color: #bbb;
  text-decoration: none;
}

h1 a:hover {
  color: #fff;
}

h1 .separator {
  font-size: 14px;
  color: #666;
}

#physics-gallery {
  position: absolute;
  top: 120px;
  left: 0;
  right: 0;
  bottom: 120px;
}

footer {
  position: absolute;
  bottom: 60px;
  width: 100%;
  text-align: center;
  color: #bbb;
  font-size: 12px;
}

#contact-container {
  position: absolute;
  bottom: 20px;
  width: 100%;
  text-align: center;
  font-family: "Times New Roman", serif;
  font-size: 8pt;
  cursor: pointer;
}

#email {
  opacity: 0;
  transition: opacity 0.5s ease;
}
</style>
</head>

<body>

<h1>
  <span>Camden Lethcoe</span>
  <span class="separator">|</span>
  <a href="https://instagram.com/ensembleofthings" target="_blank">Instagram</a>
  <span class="separator">|</span>
  <a href="mailto:cam@lethcoe.pics">Email</a>
</h1>

<div id="physics-gallery"></div>

<footer>© <span id="y"></span> Camden Lethcoe</footer>

<div id="contact-container">
  <span id="contact-button">contact me</span>
  <span id="email"> cam@lethcoe.pics</span>
</div>

<script>
document.getElementById('y').textContent = new Date().getFullYear();

const button = document.getElementById('contact-button');
const email = document.getElementById('email');

button.addEventListener('click', () => {
  email.style.opacity = 1;
  button.style.display = 'none';
});
</script>

<script>
const {
  Engine,
  Render,
  World,
  Bodies,
  Mouse,
  MouseConstraint,
  Composite
} = Matter;

const container = document.getElementById("physics-gallery");

const engine = Engine.create();
engine.gravity.y = 0;

const render = Render.create({
  element: container,
  engine: engine,
  options: {
    width: window.innerWidth,
    height: window.innerHeight - 240,
    wireframes: false,
    background: "#111"
  }
});

Render.run(render);
Engine.run(engine);

// Walls
function addWalls() {
  const w = render.options.width;
  const h = render.options.height;

  World.add(engine.world, [
    Bodies.rectangle(w / 2, -25, w, 50, { isStatic: true }),
    Bodies.rectangle(w / 2, h + 25, w, 50, { isStatic: true }),
    Bodies.rectangle(-25, h / 2, 50, h, { isStatic: true }),
    Bodies.rectangle(w + 25, h / 2, 50, h, { isStatic: true })
  ]);
}

addWalls();

// Mouse drag
const mouse = Mouse.create(render.canvas);
const mouseConstraint = MouseConstraint.create(engine, {
  mouse,
  constraint: {
    stiffness: 0.15,
    render: { visible: false }
  }
});
World.add(engine.world, mouseConstraint);

// Photos generated by Jekyll
const photos = [
{% assign photos = site.static_files | where_exp:"f","f.path contains '/photos/'" %}
{% for photo in photos %}
  {
    full: "{{ photo.path }}",
    thumb: "{{ photo.path | replace:'/photos/','/thumbnails/' }}",
    title: "{{ photo.name }}"
  },
{% endfor %}
];

// Create image bodies
photos.forEach(photo => {
  const size = 90 + Math.random() * 50;

  const body = Bodies.circle(
    Math.random() * render.options.width,
    Math.random() * render.options.height,
    size / 2,
    {
      restitution: 0.9,
      frictionAir: 0.03,
      render: {
        sprite: {
          texture: photo.thumb,
          xScale: size / 400,
          yScale: size / 400
        }
      }
    }
  );

  body.photo = photo;
  World.add(engine.world, body);
});

// Click → Lightbox
render.canvas.addEventListener("mouseup", () => {
  const bodies = Composite.allBodies(engine.world);
  bodies.forEach(b => {
    if (b.photo && Matter.Bounds.contains(b.bounds, mouse.position)) {
      const a = document.createElement("a");
      a.href = b.photo.full;
      a.setAttribute("data-lightbox", "portfolio");
      a.setAttribute("data-title", b.photo.title);
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  });
});

// Resize
window.addEventListener("resize", () => {
  render.canvas.width = window.innerWidth;
  render.canvas.height = window.innerHeight - 240;
  render.options.width = window.innerWidth;
  render.options.height = window.innerHeight - 240;
});
</script>

</body>
</html>
