---
layout: null
---

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Camden Lethcoe</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Lightbox -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/css/lightbox.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/js/lightbox-plus-jquery.min.js"></script>

<!-- Matter.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

<style>
body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
}

h1 {
  margin: 20px;
  font-family: Georgia, serif;
  font-size: 48px;
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  align-items: baseline;
  position: relative;
  z-index: 10;
}

h1 a, #return-btn {
  font-size: 13px;
  color: #999;
  text-decoration: none;
  cursor: pointer;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-weight: 300;
  letter-spacing: 0.3px;
  transition: color 0.2s ease;
}

h1 a:hover, #return-btn:hover {
  color: #fff;
}

.separator { 
  color: #666;
  font-size: 10px;
}

/* Masonry grid */
.gallery {
  column-count: 4;
  column-gap: 0;
  max-width: 1200px;
  margin: 0 auto;
}

.gallery a {
  display: block;
  width: 100%;
  break-inside: avoid;
}

.gallery img {
  width: 100%;
  display: block;
  pointer-events: none;
  user-select: none;
}

@media (max-width: 768px) {
  h1 { font-size: 32px; }
  .gallery { column-count: 2; }
}

.hidden { display: none !important; }

/* Physics canvas */
#physics-gallery {
  position: fixed;
  top: 120px;
  bottom: 0;
  left: 0;
  right: 0;
  display: none;
  z-index: 100;
}

#physics-gallery canvas {
  cursor: grab;
}

#physics-gallery canvas:active {
  cursor: grabbing;
}

/* About */
#about-page {
  display: none;
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 100;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px;
}

#about-page.active { display: flex; }

#about-return {
  font-size: 13px;
  color: #999;
  cursor: pointer;
  margin-bottom: 60px;
}

#about-return:hover { color: #fff; }

#about-text {
  font-family: Georgia, serif;
  font-size: 20px;
  max-width: 600px;
  text-align: center;
}

footer {
  text-align: center;
  color: #bbb;
  padding: 20px;
}

#fun-btn {
  font-size: 12px;
  cursor: pointer;
}
</style>
</head>

<body>

<h1 id="main-header">
  <span>Camden Lethcoe</span>
  <span class="separator">|</span>
  <a href="https://instagram.com/ensembleofthings" target="_blank">instagram</a>
  <span class="separator">|</span>
  <a href="mailto:cam@lethcoe.pics">email</a>
  <span class="separator">|</span>
  <a id="about-link">about me</a>
  <span class="separator hidden" id="return-sep">|</span>
  <span id="return-btn" class="hidden">return to normalcy</span>
</h1>

<!-- Static gallery -->
<div class="gallery" id="static-gallery">
{% assign photos = site.static_files | where_exp:"f","f.path contains '/photos/'" %}
{% for photo in photos %}
  <a href="{{ photo.path }}" data-lightbox="portfolio">
    <img src="{{ photo.path | replace:'/photos/','/thumbnails/' }}">
  </a>
{% endfor %}
</div>

<!-- Physics -->
<div id="physics-gallery"></div>

<footer id="footer">
  <div id="fun-btn">click for fun</div>
  © <span id="y"></span> Camden Lethcoe
</footer>

<script>
document.getElementById("y").textContent = new Date().getFullYear();
</script>

<script>
/* ================= FUN MODE ================= */

const {
  Engine, Render, World, Bodies, Body,
  Mouse, MouseConstraint, Composite, Events
} = Matter;

let engine, render;

const funBtn = document.getElementById("fun-btn");
const returnBtn = document.getElementById("return-btn");
const returnSep = document.getElementById("return-sep");
const staticGallery = document.getElementById("static-gallery");
const physicsGallery = document.getElementById("physics-gallery");

funBtn.onclick = () => {
  staticGallery.classList.add("hidden");
  funBtn.classList.add("hidden");
  physicsGallery.style.display = "block";
  returnBtn.classList.remove("hidden");
  returnSep.classList.remove("hidden");
  initPhysics();
};

returnBtn.onclick = teardownPhysics;

function teardownPhysics() {
  Render.stop(render);
  World.clear(engine.world);
  Engine.clear(engine);
  render.canvas.remove();
  physicsGallery.style.display = "none";
  staticGallery.classList.remove("hidden");
  funBtn.classList.remove("hidden");
  returnBtn.classList.add("hidden");
  returnSep.classList.add("hidden");
}

function initPhysics() {
  engine = Engine.create();
  engine.gravity.x = 0;
  engine.gravity.y = 0;

  render = Render.create({
    element: physicsGallery,
    engine,
    options: {
      width: window.innerWidth,
      height: window.innerHeight - 120,
      background: "#111",
      wireframes: false,
      pixelRatio: window.devicePixelRatio
    }
  });

  Render.run(render);
  Engine.run(engine);

  const w = render.options.width;
  const h = render.options.height;

  World.add(engine.world, [
    Bodies.rectangle(w/2, -50, w, 100, { isStatic:true }),
    Bodies.rectangle(w/2, h+50, w, 100, { isStatic:true }),
    Bodies.rectangle(-50, h/2, 100, h, { isStatic:true }),
    Bodies.rectangle(w+50, h/2, 100, h, { isStatic:true })
  ]);

  /* ✅ FIXED MOUSE SCALING */
  const mouse = Mouse.create(render.canvas);
  Mouse.setScale(mouse, {
    x: 1 / window.devicePixelRatio,
    y: 1 / window.devicePixelRatio
  });

  const mouseConstraint = MouseConstraint.create(engine, {
    mouse,
    constraint: {
      stiffness: 0.9,
      damping: 0.2,
      render: { visible: false }
    }
  });

  World.add(engine.world, mouseConstraint);
  render.mouse = mouse;

  const photos = [
  {% for photo in photos %}
    "{{ photo.path | replace:'/photos/','/thumbnails/' }}",
  {% endfor %}
  ];

  photos.forEach(src => {
    const size = 90 + Math.random() * 40;
    const body = Bodies.circle(
      w/2 + Math.random()*200 - 100,
      h/2 + Math.random()*200 - 100,
      size/2,
      {
        restitution: 0.95,
        frictionAir: 0.05,
        render: {
          sprite: {
            texture: src,
            xScale: size/400,
            yScale: size/400
          }
        }
      }
    );
    World.add(engine.world, body);
  });

  Events.on(engine, "beforeUpdate", () => {
    Composite.allBodies(engine.world).forEach(b => {
      if (!b.isStatic) {
        Body.applyForce(b, b.position, {
          x: (Math.random() - 0.5) * 0.00002,
          y: (Math.random() - 0.5) * 0.00002
        });
      }
    });
  });
}
</script>

</body>
</html>
