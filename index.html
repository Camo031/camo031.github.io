---
layout: null
---

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Camden Lethcoe</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Lightbox -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/css/lightbox.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/js/lightbox-plus-jquery.min.js"></script>

<!-- Matter.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

<style>
body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
}

h1 {
  margin: 20px;
  font-family: Georgia, serif;
  font-size: 48px;
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
}

h1 a, #return-btn {
  font-size: 14px;
  color: #bbb;
  text-decoration: none;
  cursor: pointer;
}

.separator { color: #666; }

.gallery {
  column-count: 4;
  max-width: 1200px;
  margin: auto;
}

.gallery img {
  width: 100%;
  pointer-events: none;
}

.gallery a {
  display: inline-block;
  width: 100%;
}

.hidden { display: none !important; }

#physics-gallery {
  position: fixed;
  inset: 140px 0 120px 0;
  display: none;
  z-index: 1;
}

footer {
  text-align: center;
  color: #bbb;
  padding: 30px;
}

#fun-btn {
  font-size: 12px;
  cursor: pointer;
}

#contact-container {
  font-family: "Times New Roman", serif;
  font-size: 8pt;
  text-align: center;
  margin-bottom: 30px;
}

@media (max-width: 768px) {
  h1 { font-size: 32px; }
  .gallery { column-count: 2; }
}
</style>
</head>

<body>

<h1>
  <span>Camden Lethcoe</span>
  <span class="separator">|</span>
  <a href="https://instagram.com/ensembleofthings" target="_blank">Instagram</a>
  <span class="separator">|</span>
  <a href="mailto:cam@lethcoe.pics">Email</a>
  <span class="separator hidden" id="return-sep">|</span>
  <span id="return-btn" class="hidden">return to normalcy</span>
</h1>

<div class="gallery" id="static-gallery">
{% assign photos = site.static_files | where_exp:"f","f.path contains '/photos/'" %}
{% for photo in photos %}
  <a href="{{ photo.path }}" data-lightbox="portfolio">
    <img src="{{ photo.path | replace:'/photos/','/thumbnails/' }}">
  </a>
{% endfor %}
</div>

<div id="physics-gallery"></div>

<footer>
  <div id="fun-btn">click for fun</div>
  © <span id="y"></span> Camden Lethcoe
</footer>

<div id="contact-container">
  <span id="contact-button">contact me</span>
  <span id="email" style="opacity:0;"> cam@lethcoe.pics</span>
</div>

<script>
document.getElementById("y").textContent = new Date().getFullYear();
document.getElementById("contact-button").onclick = () => {
  document.getElementById("email").style.opacity = 1;
};
</script>

<script>
/* ================= FUN MODE ================= */

const {
  Engine, Render, World, Bodies, Body,
  Mouse, MouseConstraint, Composite, Events, Bounds
} = Matter;

const isMobile = window.matchMedia("(max-width:768px)").matches;
let engine, render, mouseConstraint;
let longPressTimer = null;

const funBtn = document.getElementById("fun-btn");
const returnBtn = document.getElementById("return-btn");
const returnSep = document.getElementById("return-sep");
const staticGallery = document.getElementById("static-gallery");
const physicsGallery = document.getElementById("physics-gallery");

funBtn.onclick = () => {
  staticGallery.classList.add("hidden");
  funBtn.classList.add("hidden");
  physicsGallery.style.display = "block";
  returnBtn.classList.remove("hidden");
  returnSep.classList.remove("hidden");
  document.body.style.overflow = "hidden";
  initPhysics();
};

returnBtn.onclick = () => {
  Render.stop(render);
  World.clear(engine.world);
  Engine.clear(engine);
  render.canvas.remove();
  physicsGallery.style.display = "none";
  staticGallery.classList.remove("hidden");
  funBtn.classList.remove("hidden");
  returnBtn.classList.add("hidden");
  returnSep.classList.add("hidden");
  document.body.style.overflow = "";
};

function initPhysics() {
  engine = Engine.create();
  engine.gravity.y = 0.2;

  render = Render.create({
    element: physicsGallery,
    engine,
    options: {
      width: window.innerWidth,
      height: window.innerHeight - 260,
      background: "#111",
      wireframes: false,
      pixelRatio: window.devicePixelRatio
    }
  });

  Render.run(render);
  Engine.run(engine);

  const w = render.options.width;
  const h = render.options.height;

  World.add(engine.world, [
    Bodies.rectangle(w/2, -40, w, 80, { isStatic:true }),
    Bodies.rectangle(w/2, h+40, w, 80, { isStatic:true }),
    Bodies.rectangle(-40, h/2, 80, h, { isStatic:true }),
    Bodies.rectangle(w+40, h/2, 80, h, { isStatic:true })
  ]);

  const mouse = Mouse.create(render.canvas);
  mouseConstraint = MouseConstraint.create(engine, {
    mouse,
    constraint: {
      stiffness: 0.15,
      damping: isMobile ? 0.4 : 0.05,
      render: { visible:false }
    }
  });
  World.add(engine.world, mouseConstraint);

  const photos = [
  {% for photo in photos %}
    {
      full: "{{ photo.path }}",
      thumb: "{{ photo.path | replace:'/photos/','/thumbnails/' }}"
    },
  {% endfor %}
  ];

  photos.forEach(p => {
    if (isMobile && Composite.allBodies(engine.world).filter(b => b.photo).length >= 12) return;

    const size = isMobile ? 70 + Math.random()*30 : 90 + Math.random()*50;
    const body = Bodies.circle(
      w*0.2 + Math.random()*w*0.6,
      h*0.2 + Math.random()*h*0.6,
      size/2,
      {
        restitution: 0.9,
        frictionAir: 0.05,
        render: {
          sprite: {
            texture: p.thumb,
            xScale: size/400,
            yScale: size/400
          }
        }
      }
    );
    body.photo = p;
    World.add(engine.world, body);
  });

  /* Magnetic repulsion + idle motion */
  Events.on(engine, "beforeUpdate", () => {
    const bodies = Composite.allBodies(engine.world).filter(b => b.photo);
    bodies.forEach(a => {
      bodies.forEach(b => {
        if (a === b) return;
        const dx = a.position.x - b.position.x;
        const dy = a.position.y - b.position.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 120) {
          Body.applyForce(a, a.position, {
            x: dx * 0.000002,
            y: dy * 0.000002
          });
        }
      });
      Body.applyForce(a, a.position, {
        x: (Math.random() - 0.5) * 0.00005,
        y: (Math.random() - 0.5) * 0.00005
      });
    });
  });

  /* Tap / click shuffle */
  render.canvas.addEventListener("click", () => {
    Composite.allBodies(engine.world).forEach(b => {
      if (b.photo) {
        Body.setVelocity(b, {
          x: (Math.random() - 0.5) * 15,
          y: (Math.random() - 0.5) * 15
        });
      }
    });
  });

  /* Long press / long click to open image */
  const openPhotoAt = (pos) => {
    const bodies = Composite.allBodies(engine.world);
    for (let b of bodies) {
      if (b.photo && Bounds.contains(b.bounds, pos)) {
        const a = document.createElement("a");
        a.href = b.photo.full;
        a.setAttribute("data-lightbox", "portfolio");
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        break;
      }
    }
  };

  const startLongPress = (pos) => {
    longPressTimer = setTimeout(() => openPhotoAt(pos), 500);
  };
  const cancelLongPress = () => clearTimeout(longPressTimer);

  render.canvas.addEventListener("mousedown", e => startLongPress(mouse.position));
  render.canvas.addEventListener("touchstart", e => startLongPress(mouse.position));
  ["mouseup","mouseleave","touchend","touchcancel"].forEach(ev =>
    render.canvas.addEventListener(ev, cancelLongPress)
  );

  /* Mobile gravity tilt */
  if (isMobile && window.DeviceOrientationEvent) {
    window.addEventListener("deviceorientation", e => {
      engine.gravity.x = Math.max(-1, Math.min(1, e.gamma / 30));
      engine.gravity.y = Math.max(-1, Math.min(1, e.beta / 30));
    });
  }
}
</script>

</body>
</html>
